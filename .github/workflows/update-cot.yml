name: Update COT data
on:
  schedule:
    # CFTC publishes Fridays ~3:30pm ET; run Fri evening + Sat/Mon as backups
    - cron: '30 21 * * 5'
    - cron: '0 12 * * 6'
    - cron: '0 12 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fetch_cot.py
      - name: Commit if changed
        run: |
          git config user.name "cot-bot"
          git config user.email "cot-bot@users.noreply.github.com"
          git add data/cot.json
          git diff --staged --quiet || (git commit -m "Update COT snapshot" && git push)
